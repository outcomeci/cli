apiVersion: outcomeci.dev/v1alpha1
kind: OutcomeWorkflow
metadata:
  name: customer-follow-up
spec:
  backend: {provider: filesystem}
  context: {provider: filesystem, include: []}
  instructions:
    standup: {path: instructions.md}
  agents:
    default: {runner: codex}
    phases:
      intake:
        instructions: instructions.md
        needs: []
        integrations:
          - {type: api, capability: customer.lookup}
          - type: human
            timing: after
            id: confirm_follow_up
            participant: requester
            purpose: Confirm the follow-up is appropriate.
            interaction: approval
  integration_packages:
    - {path: customer.integration.yml}
