apiVersion: outcomeci.com/v1alpha1
kind: OutcomeProof
metadata:
  name: docs-quickstart-v1
  version: 2.0.0
spec:
  persona:
    name: docs_quickstart_reader
    version: 2.0.0
    starting_state:
      account: none
      workspace: empty
      network: online
      credentials: none
  journey:
    - {id: fetch_quickstart, action: docs.fetch, with: {page: quickstart}}
    - id: check_cli_available
      action: cli.exec
      with: {page: quickstart, fixture: cli-available}
    - id: init_workspace
      action: cli.exec
      with: {page: quickstart, fixture: init}
    - id: validate_workspace
      action: cli.exec
      with: {id: validate, command: oci validate}
  faults: []
  assertions:
    - docs.cli_available
    - docs.init_succeeds
    - docs.init_creates_workflow
    - docs.init_creates_step_instructions
    - docs.workflow_validates
  output:
    report: proof-report.json
    ledger: proof-events.jsonl
