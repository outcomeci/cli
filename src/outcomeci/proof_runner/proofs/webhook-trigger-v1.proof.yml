apiVersion: outcomeci.dev/v1alpha1
kind: OutcomeProof
metadata:
  name: webhook-trigger-v1
  version: 1.0.0
spec:
  persona:
    name: webhook_sender
    version: 1.0.0
    starting_state:
      account: none
      workspace: empty
      network: offline
      credentials: none
  journey:
    - {id: initialize, action: workspace.initialize}
    - {id: configure, action: webhook_trigger.configure}
    - id: fire_valid_payload
      action: webhook_trigger.fire
      with:
        label: accepts_valid_payload
        payload:
          schema_version: outcomeci.trigger.webhook.received/v1
          type: webhook.received
          event_id: evt-valid
          received_at: "2026-01-01T00:00:00Z"
          method: POST
          query: ""
          headers: {content-type: application/json}
          body_base64: eyJtZXNzYWdlIjoiaGVsbG8ifQ==
    - id: fire_oversized_payload
      action: webhook_trigger.fire
      with:
        label: oversized_payload
        synthetic_oversized: true
        expect_failure: true
        expect_error_contains: exceeds
    - id: fire_schema_invalid_payload
      action: webhook_trigger.fire
      with:
        label: schema_invalid_payload
        expect_failure: true
        payload:
          schema_version: outcomeci.trigger.webhook.received/v1
          type: webhook.received
          received_at: "2026-01-01T00:00:00Z"
          method: POST
          query: ""
          headers: {}
          body_base64: ""
  faults: []
  assertions:
    - webhook_trigger.definition_compiles
    - webhook_trigger.accepts_valid_payload
    - webhook_trigger.state_shape_matches_payload
    - webhook_trigger.intent_falls_back_to_generic_text
    - webhook_trigger.rejects_oversized_payload
    - webhook_trigger.rejects_schema_invalid_payload
  output:
    report: proof-report.json
    ledger: proof-events.jsonl
