apiVersion: outcomeci.dev/v1alpha1
kind: OutcomeProof
metadata:
  name: vault-credentials-v1
  version: 1.0.0
spec:
  persona:
    name: credential_operator
    version: 1.0.0
    starting_state:
      account: none
      workspace: empty
      network: offline
      credentials: none
  journey:
    - {id: initialize, action: workspace.initialize}
    - {id: initialize_vault, action: vault.initialize}
    - id: store_api_key
      action: vault.put_credential
      with: {path: credentials/api-key, value: {value: oci_vault_proof_api_key}}
    - id: check_api_key
      action: connection.authenticate
      with: {auth_type: api_key, credential_path: credentials/api-key}
    - id: store_basic
      action: vault.put_credential
      with: {path: credentials/basic, value: {username: svc, password: oci_vault_proof_basic_pw}}
    - id: check_basic
      action: connection.authenticate
      with: {auth_type: basic, credential_path: credentials/basic}
    - id: store_bearer
      action: vault.put_credential
      with: {path: credentials/bearer, value: {value: oci_vault_proof_bearer_v1}}
    - id: check_bearer
      action: connection.authenticate
      with: {auth_type: bearer, credential_path: credentials/bearer}
    - id: rotate_bearer
      action: vault.rotate_credential
      with: {path: credentials/bearer, value: {value: oci_vault_proof_bearer_v2}}
    - id: recheck_bearer
      action: connection.authenticate
      with: {auth_type: bearer, credential_path: credentials/bearer, after_rotation: true}
    - id: store_oauth_cc
      action: vault.put_credential
      with: {path: credentials/oauth-cc, value: {client_id: svc, client_secret: oci_vault_proof_cc_v1}}
    - id: check_oauth_cc
      action: connection.authenticate
      with: {auth_type: oauth2_client_credentials, credential_path: credentials/oauth-cc}
    - id: rotate_oauth_cc
      action: vault.rotate_credential
      with: {path: credentials/oauth-cc, value: {client_id: svc, client_secret: oci_vault_proof_cc_v2}}
    - id: recheck_oauth_cc
      action: connection.authenticate
      with:
        auth_type: oauth2_client_credentials
        credential_path: credentials/oauth-cc
        after_rotation: true
    - id: store_oauth_refresh
      action: vault.put_credential
      with: {path: credentials/oauth-refresh, value: {refresh_token: oci_vault_proof_refresh}}
    - id: check_oauth_refresh
      action: connection.authenticate
      with: {auth_type: oauth2_refresh_token, credential_path: credentials/oauth-refresh}
    - id: store_jwt
      action: vault.generate_jwt_credential
      with: {path: credentials/jwt, issuer: oci-vault-proof, subject: proof-runner}
    - id: check_jwt
      action: connection.authenticate
      with: {auth_type: jwt_bearer, credential_path: credentials/jwt}
    - id: resolve_bearer_after_rotation
      action: vault.resolve_credential
      with: {path: credentials/bearer}
    - id: check_env_credential
      action: credential.resolve_env
      with: {env_var: OCI_VAULT_PROOF_ENV_CREDENTIAL}
    - {id: start_cloud_session, action: cloud.mock_session}
    - id: put_cloud_secret
      action: cloud.vault_put
      with: {path: cloud/db-password, value: oci_vault_proof_cloud_v1, workflow_ids: [wf_a]}
    - id: rotate_cloud_secret
      action: cloud.vault_rotate
      with: {path: cloud/db-password, value: oci_vault_proof_cloud_v2}
    - id: verify_cloud_secret
      action: cloud.vault_verify
      with:
        path: cloud/db-password
        expected_value: oci_vault_proof_cloud_v2
        expected_workflow_ids: [wf_a]
  faults: []
  assertions:
    - credential.api_key_authenticates
    - credential.basic_authenticates
    - credential.bearer_authenticates
    - credential.oauth2_client_credentials_authenticates
    - credential.oauth2_refresh_token_authenticates
    - credential.jwt_bearer_authenticates
    - credential.env_reference_resolves
    - vault.rotation_takes_effect
    - credentials.never_exposed
    - cloud_vault.rotation_takes_effect
    - cloud_vault.grants_survive_rotation
    - cloud_session.expired_token_auto_refreshes
  output:
    report: proof-report.json
    ledger: proof-events.jsonl
