name: Docs proof runner container

# This image installs outcomeci-cli fresh at container start (see
# docs-proof-entrypoint.sh) rather than baking it in, so it only needs
# rebuilding when the image itself changes, not on every CLI change.
on:
  pull_request:
    paths:
      - "Dockerfile.docs-proof-runner"
      - "scripts/docs-proof-entrypoint.sh"
      - ".github/workflows/docs-proof-runner-container.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile.docs-proof-runner"
      - "scripts/docs-proof-entrypoint.sh"
      - ".github/workflows/docs-proof-runner-container.yml"

concurrency:
  group: docs-proof-runner-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.docs-proof-runner
          load: true
          tags: docs-proof-runner:scan
          platforms: linux/amd64
          cache-from: type=gha,scope=docs-proof-runner
          cache-to: type=gha,mode=max,scope=docs-proof-runner
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: docs-proof-runner:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.RUNNER_IMAGE_AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Log in to Amazon ECR
        if: github.event_name != 'pull_request'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.docs-proof-runner
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/outcomeci-docs-proof-runner:latest
          platforms: linux/amd64
          cache-from: type=gha,scope=docs-proof-runner
