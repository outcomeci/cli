name: Proof runner container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: proof-runner-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  INTERNAL_IMAGE: outcomeci-proof-runner

jobs:
  proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Resolve candidate version
        id: candidate
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=release-$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0+sha.${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
            echo "tag=commit-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Build immutable candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.proof-runner
          load: true
          tags: proof-runner:candidate
          platforms: linux/amd64
          build-args: OUTCOMECI_CLI_VERSION=${{ steps.candidate.outputs.version }}
          cache-from: type=gha,scope=proof-runner
          cache-to: type=gha,mode=max,scope=proof-runner
      - name: Run local-first proof without external networking
        run: docker run --rm --network none --tmpfs /proof:rw,noexec,nosuid,uid=10001,gid=10001,size=128m proof-runner:candidate
      - name: Scan candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: proof-runner:candidate
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Configure internal registry
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.RUNNER_IMAGE_AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Log in to internal ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Publish tested proof runner internally
        if: github.event_name == 'push'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          INTERNAL_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          if aws ecr describe-images --repository-name "$INTERNAL_IMAGE" --image-ids "imageTag=$INTERNAL_TAG" >/dev/null 2>&1; then
            echo "Internal candidate $INTERNAL_TAG already exists; preserving the original immutable artifact."
            exit 0
          fi
          docker tag proof-runner:candidate "$REGISTRY/$INTERNAL_IMAGE:$INTERNAL_TAG"
          docker push "$REGISTRY/$INTERNAL_IMAGE:$INTERNAL_TAG"
