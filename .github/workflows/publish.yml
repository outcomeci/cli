name: Promote release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Fetches the exact build internal-release.yml published for the tag. It runs
  # outside the pypi environment: the AWS role trusts main and tags, not
  # environments, and the job that can publish to PyPI needs no AWS access.
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.RUNNER_IMAGE_AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: pip install hatchling hatch-vcs
      - name: Download the internally tested distributions
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          aws codeartifact login --tool pip --domain outcomeci --repository python-internal
          mkdir dist
          pip download --no-deps --only-binary=:all: --dest dist "outcomeci-cli==$VERSION"
          pip download --no-deps --no-build-isolation --no-binary=:all: --dest dist "outcomeci-cli==$VERSION"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: download
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
      - name: Promote Homebrew formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh workflow run homebrew.yml --ref main -f tag="$TAG"
