name: Promote release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.RUNNER_IMAGE_AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: pip install hatchling hatch-vcs
      - name: Download the internally tested distributions
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          aws codeartifact login --tool pip --domain outcomeci --repository python-internal
          mkdir dist
          pip download --no-deps --only-binary=:all: --dest dist "outcomeci-cli==$VERSION"
          pip download --no-deps --no-build-isolation --no-binary=:all: --dest dist "outcomeci-cli==$VERSION"
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Resolve release range
        id: release-range
        env:
          TAG: ${{ inputs.tag }}
        run: scripts/release-range.sh "$TAG" "$GITHUB_OUTPUT"
      - name: Resolve version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CHANGELOG_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Render release notes
        id: changelog
        uses: outcomeci/spareparts-changelog@v0
        with:
          provider: anthropic
          instructions: ${{ vars.CHANGELOG_INSTRUCTIONS }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          from: ${{ steps.release-range.outputs.from }}
          to: ${{ steps.release-range.outputs.to }}
          title: ${{ inputs.tag }}
          write-repository: "false"
          publish-s3: "true"
          s3-bucket: ${{ vars.CHANGELOG_S3_BUCKET }}
          s3-key: releases/outcomeci-cli/${{ steps.version.outputs.version }}.md
          s3-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          publish-linkedin: "false"
      - name: Create GitHub release
        env:
          RELEASE_NOTES: ${{ steps.changelog.outputs.markdown }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          test -n "$RELEASE_NOTES"
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          gh release create "$TAG" --notes-file release-notes.md --verify-tag
      - name: Promote Homebrew formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh workflow run homebrew.yml --ref main -f tag="$TAG"
