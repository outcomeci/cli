name: Outcome runner container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: outcome-runner-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/outcomeci/outcome-runner

jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          load: true
          tags: outcome-runner:scan
          platforms: linux/amd64
          build-args: OUTCOMECI_CLI_VERSION=0.0.0
          cache-from: type=gha,scope=outcome-runner
          cache-to: type=gha,mode=max,scope=outcome-runner
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: outcome-runner:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.RUNNER_IMAGE_AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Log in to Amazon ECR
        if: github.event_name != 'pull_request'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Generate GHCR image metadata
        if: github.event_name != 'pull_request'
        id: ghcr_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - name: Generate immutable ECR image metadata
        if: github.event_name != 'pull_request'
        id: ecr_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/outcomeci-outcome-runner
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - name: Publish immutable image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          push: true
          tags: |
            ${{ steps.ghcr_meta.outputs.tags }}
            ${{ steps.ecr_meta.outputs.tags }}
          labels: ${{ steps.ghcr_meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: OUTCOMECI_CLI_VERSION=0.0.0
          cache-from: type=gha,scope=outcome-runner
