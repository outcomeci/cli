[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "outcomeci-cli"
dynamic = ["version"]
description = "Write, run and publish OutcomeCI workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "PyYAML>=6.0",
    "cryptography>=43",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pyte>=0.8",
    # The connector contract the compiler and executor read: 0.2 declares the
    # credential kinds each provider accepts.
    "outcomeci-connectors>=0.2,<0.3",
]

[project.scripts]
oci = "outcomeci.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.3", "build>=1.2", "ruff>=0.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/outcomeci"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
version_scheme = "semver2"
tag_format = "v${version}"
major_version_zero = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
