[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "outcomeci-cli"
dynamic = ["version"]
description = "Portable Standup and outcome workflow runtime for OutcomeCI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "PyYAML>=6.0",
    "cryptography>=43",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pyte>=0.8",
    # Pinned to a commit, not a tag: a tag is mutable and this repo has no
    # lockfile, so a commit SHA is what actually keeps this reproducible.
    # Bump it deliberately when outcomeci/connectors releases something cli
    # needs.
    "outcomeci-connectors @ git+https://github.com/outcomeci/connectors@a7826cad5de4bc61dda4952145f96acfa7f409a4",
]

[project.scripts]
oci = "outcomeci.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.3", "build>=1.2", "ruff>=0.13", "sentry-sdk>=2"]
monitoring = ["sentry-sdk>=2"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/outcomeci"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
version_scheme = "semver2"
tag_format = "v${version}"
major_version_zero = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
